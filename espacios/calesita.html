<style>
/* Layout: escena 3D a pantalla completa con luz de día; rótulos arriba y mandos abajo. El giro manda: óxido como protagonista sobre carbón, estelas en bordó, violeta y azul, puntada espiga en blanco. */
:root {
  --papel: #F3F3F1;
  --carbon: #1F1C1E;
  --oxido: #C15F2B;
  --bordo: #931468;
  --violeta: #A330B6;
  --azul: #003B94;
  --ambar: #E19A00;
  --tinta: #1F1C1E;
  --display: "Clash Display", "Big Shoulders", "Arial Black", system-ui, sans-serif;
  --mono: "Big Shoulders", "Arial Narrow", system-ui, sans-serif;
}
html, body { height: 100%; }
body { background: var(--papel); color: var(--tinta); overflow: hidden; font-family: var(--mono); }
#escena { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }

.rotulo {
  position: fixed; top: 0; left: 0; right: 0;
  padding-top: calc(14px + env(safe-area-inset-top, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;
  pointer-events: none;
}
.marca { font-family: var(--display); font-weight: 800; line-height: .82; font-size: clamp(26px, 4vw, 40px); color: var(--carbon); letter-spacing: -.02em; }
.marca small { display: block; font-size: .42em; letter-spacing: .02em; font-weight: 500; }
.ficha { text-align: right; font-size: 11px; line-height: 1.5; letter-spacing: .06em; text-transform: uppercase; color: var(--tinta); }
.ficha strong { display: block; font-family: var(--display); font-weight: 800; text-transform: none; letter-spacing: -.01em; font-size: clamp(20px, 3vw, 30px); line-height: 1; color: var(--oxido); margin-bottom: 4px; }
.ficha .hilo { color: var(--bordo); }

.mandos {
  position: fixed; left: 0; right: 0; bottom: 0;
  padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between;
}
.grupo { display: flex; flex-wrap: wrap; gap: 6px; }
button {
  font: 600 14px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase;
  background: var(--papel); color: var(--oxido);
  border: 1.5px dashed var(--oxido); padding: 9px 12px; cursor: pointer;
}
button[aria-pressed="true"] { background: var(--oxido); color: var(--papel); border-style: solid; }
button:hover { border-style: solid; }
button:focus-visible { outline: 2px solid var(--carbon); outline-offset: 2px; }
.pista { font-size: 11px; color: var(--tinta); opacity: .7; }

#mostrar {
  position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  opacity: .35; font-size: 11px; padding: 6px 9px;
}
#mostrar:hover { opacity: 1; }
body.limpio .rotulo, body.limpio .mandos { display: none; }
body:not(.limpio) #mostrar { display: none; }

@media (max-width: 520px) {
  .pista { display: none; }
  .ficha span { display: none; }
}
body.embebido .marca{display:none}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
  const C = { papel:'#F3F3F1', carbon:'#1F1C1E', oxido:'#C15F2B', bordo:'#931468', violeta:'#A330B6', azul:'#003B94', ambar:'#E19A00', crudo:'#E6DDCB' };
  const TAU = Math.PI * 2;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- Renderer ----------
  const canvas = document.getElementById('escena');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color('#E6EEF5');
  scene.fog = new THREE.Fog('#E3EBEE', 40, 95);

  const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 200);
  camera.position.set(17, 6, 19);
  const controls = new THREE.OrbitControls(camera, canvas);
  controls.target.set(0, 4, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 1.5;
  controls.maxDistance = 40;
  controls.maxPolarAngle = Math.PI * 0.94;

  // ---------- Luz natural ----------
  scene.add(new THREE.HemisphereLight('#FFF6E8', '#8C9A6A', 0.8));
  const sol = new THREE.DirectionalLight('#FFE7C4', 1.25);
  sol.position.set(12, 18, 8);
  sol.castShadow = true;
  sol.shadow.mapSize.set(2048, 2048);
  Object.assign(sol.shadow.camera, { left: -18, right: 18, top: 18, bottom: -18, near: 1, far: 60 });
  sol.shadow.bias = -0.0005;
  sol.shadow.radius = 4;
  scene.add(sol);

  // ---------- Texturas dibujadas ----------
  function lienzo(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }
  function textura(c) { const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = renderer.capabilities.getMaxAnisotropy(); return t; }
  function trama(ctx, w, h, paso, alpha) {
    ctx.save(); ctx.globalAlpha = alpha;
    for (let y = 0; y < h; y += paso) { ctx.strokeStyle = Math.random() < .5 ? '#000' : '#fff'; ctx.lineWidth = paso * (.25 + Math.random() * .3); ctx.beginPath(); ctx.moveTo(0, y + Math.random()); ctx.lineTo(w, y + Math.random() * 2); ctx.stroke(); }
    for (let x = 0; x < w; x += paso) { ctx.strokeStyle = Math.random() < .5 ? '#000' : '#fff'; ctx.lineWidth = paso * (.2 + Math.random() * .3); ctx.beginPath(); ctx.moveTo(x + Math.random(), 0); ctx.lineTo(x + Math.random() * 2, h); ctx.stroke(); }
    ctx.restore();
  }
  function espiral(ctx, cx, cy, R, vueltas, fase, color, ancho, dash) {
    ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = ancho; ctx.lineCap = 'round';
    if (dash) ctx.setLineDash(dash);
    ctx.beginPath();
    const n = 1400;
    for (let i = 0; i <= n; i++) { const t = i / n; const a = fase + t * vueltas * TAU; const r = R * t; const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.stroke(); ctx.restore();
  }
  // puntada espiga a lo largo de una recta horizontal
  function espigaRecta(ctx, x0, x1, y, h, paso, color, ancho) {
    ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = ancho; ctx.lineCap = 'round';
    let k = 0;
    for (let x = x0; x < x1; x += paso, k++) { ctx.beginPath(); if (k % 2) { ctx.moveTo(x, y + h); ctx.lineTo(x + paso * 1.6, y - h); } else { ctx.moveTo(x, y - h); ctx.lineTo(x + paso * 1.6, y + h); } ctx.stroke(); }
    ctx.restore();
  }
  // puntada espiga a lo largo de un círculo
  function espigaCirculo(ctx, cx, cy, r, h, n, color, ancho) {
    ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = ancho; ctx.lineCap = 'round';
    for (let k = 0; k < n; k++) {
      const a0 = k / n * TAU, a1 = a0 + 1.6 / n * TAU, s = k % 2 ? 1 : -1;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a0) * (r + s * h), cy + Math.sin(a0) * (r + s * h));
      ctx.lineTo(cx + Math.cos(a1) * (r - s * h), cy + Math.sin(a1) * (r - s * h));
      ctx.stroke();
    }
    ctx.restore();
  }
  function salpicar(ctx, px, py, color, n, rmax) {
    ctx.save(); ctx.fillStyle = color;
    for (let k = 0; k < n; k++) { const a = Math.random() * TAU, d = Math.random() ** 2 * rmax; ctx.beginPath(); ctx.arc(px + Math.cos(a) * d, py + Math.sin(a) * d, 2 + Math.random() * (k < 3 ? rmax * .25 : rmax * .07), 0, TAU); ctx.fill(); }
    ctx.restore();
  }

  // Techo invertido: carbón con la espiral óxido y estelas de color, como una foto de larga exposición
  function texTecho() {
    const S = 2048, [c, x] = lienzo(S, S), m = S / 2;
    x.fillStyle = C.carbon; x.fillRect(0, 0, S, S);
    trama(x, S, S, 6, .08);
    espiral(x, m, m, m * .98, 5, 0, C.oxido, 78);
    espiral(x, m, m, m * .98, 5, Math.PI * .55, C.bordo, 12);
    espiral(x, m, m, m * .98, 5, Math.PI * 1.1, C.violeta, 8);
    espiral(x, m, m, m * .98, 5, Math.PI * 1.5, C.azul, 10);
    espiral(x, m, m, m * .98, 5, 0, C.papel, 6, [26, 22]);
    salpicar(x, m * 1.45, m * .62, C.oxido, 40, 120);
    salpicar(x, m * .55, m * 1.4, C.papel, 30, 90);
    // borde: banda óxido con puntada espiga blanca
    x.strokeStyle = C.oxido; x.lineWidth = 64; x.beginPath(); x.arc(m, m, m - 34, 0, TAU); x.stroke();
    espigaCirculo(x, m, m, m - 34, 18, 220, C.papel, 5);
    return textura(c);
  }

  // Faldón invertido: el festón apunta hacia arriba
  function texFaldon() {
    const W = 2048, H = 256, [c, x] = lienzo(W, H);
    const base = 106, ondas = 16, r = W / ondas / 2;
    x.fillStyle = C.oxido; x.fillRect(0, base, W, H - base);
    for (let i = 0; i < ondas; i++) { x.beginPath(); x.arc(r + i * 2 * r, base, r, Math.PI, TAU); x.fill(); }
    trama(x, W, H, 5, .14);
    espigaRecta(x, 0, W, 190, 16, 18, C.papel, 5);
    x.fillStyle = C.carbon;
    for (let i = 0; i < ondas; i++) { x.beginPath(); x.arc(r + i * 2 * r, base - r * .35, 9, 0, TAU); x.fill(); }
    const t = textura(c); t.wrapS = THREE.RepeatWrapping; t.repeat.x = 2; return t;
  }

  function texPlataforma() {
    const S = 1024, [c, x] = lienzo(S, S), m = S / 2;
    x.fillStyle = '#2A2523'; x.fillRect(0, 0, S, S);
    trama(x, S, S, 4, .1);
    espiral(x, m, m, m * .96, 3.2, 0, C.oxido, 20);
    [.94, .66, .38].forEach(k => espigaCirculo(x, m, m, m * k, 10, Math.round(140 * k), C.papel, 4));
    return textura(c);
  }
  function texCanto() {
    const W = 2048, H = 128, [c, x] = lienzo(W, H);
    x.fillStyle = C.carbon; x.fillRect(0, 0, W, H);
    trama(x, W, H, 4, .12);
    x.fillStyle = C.oxido; x.fillRect(0, 38, W, 52);
    espigaRecta(x, 0, W, 64, 16, 16, C.papel, 4);
    const t = textura(c); t.wrapS = THREE.RepeatWrapping; t.repeat.x = 2; return t;
  }

  // Suelo: arpillera con salpicaduras y el recorrido en espiral que lleva a la calesita
  function texSuelo() {
    const S = 2048, [c, x] = lienzo(S, S), m = S / 2, R = S / 2;
    x.fillStyle = '#E3D8C2'; x.fillRect(0, 0, S, S);
    trama(x, S, S, 7, .16);
    [[C.oxido, .22, .3], [C.bordo, .78, .25], [C.violeta, .2, .78], [C.azul, .82, .74], [C.oxido, .62, .88]].forEach(([col, px, py]) => salpicar(x, px * S, py * S, col, 40, 120));
    x.save(); x.translate(m, m);
    const n = 900;
    x.strokeStyle = C.oxido; x.lineWidth = 12; x.lineCap = 'round'; x.setLineDash([30, 16]);
    x.beginPath();
    for (let i = 0; i <= n; i++) { const t = i / n; const r = R * (1 - t * .66); const a = -Math.PI * .25 + t * TAU * 1.6; const X = Math.cos(a) * r, Y = Math.sin(a) * r; i ? x.lineTo(X, Y) : x.moveTo(X, Y); }
    x.stroke(); x.setLineDash([]);
    // espiga blanca a los lados del recorrido
    x.strokeStyle = C.papel; x.lineWidth = 4;
    for (let i = 0; i < 260; i++) {
      const t = i / 260, t2 = (i + 1.6) / 260, s = i % 2 ? 1 : -1;
      const r1 = R * (1 - t * .66) + s * 16, a1 = -Math.PI * .25 + t * TAU * 1.6;
      const r2 = R * (1 - t2 * .66) - s * 16, a2 = -Math.PI * .25 + t2 * TAU * 1.6;
      x.beginPath(); x.moveTo(Math.cos(a1) * r1, Math.sin(a1) * r1); x.lineTo(Math.cos(a2) * r2, Math.sin(a2) * r2); x.stroke();
    }
    x.restore();
    return textura(c);
  }

  // los colores de la paleta se pasan a lineal para que se vean tal cual (sin quedar pastel)
  const mat = (opt) => { if (typeof opt.color === 'string') opt.color = new THREE.Color(opt.color).convertSRGBToLinear(); return new THREE.MeshStandardMaterial(Object.assign({ roughness: .85, metalness: 0 }, opt)); };
  function sombra(o) { o.traverse(m => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } }); return o; }
  function hiloTubo(puntos, radio, color, segs) {
    const curva = new THREE.CatmullRomCurve3(puntos);
    return new THREE.Mesh(new THREE.TubeGeometry(curva, segs || puntos.length * 3, radio, 8, false), mat({ color, roughness: .95 }));
  }
  function helice(r, y0, y1, vueltas, fase) {
    const p = [], n = Math.max(40, vueltas * 24);
    for (let i = 0; i <= n; i++) { const t = i / n, a = fase + t * vueltas * TAU; p.push(new THREE.Vector3(Math.cos(a) * r, y0 + (y1 - y0) * t, Math.sin(a) * r)); }
    return p;
  }
  function caja(w, h, d, color, x, y, z) { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat({ color, roughness: .7 })); m.position.set(x, y, z); return m; }

  // pasto natural del predio (una baldosa de unos 12 m que se repite)
  function texPasto(rep) {
    let s = 5; const r = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    const S = 2048, [c, x] = lienzo(S, S);
    x.fillStyle = '#6E8A3E'; x.fillRect(0, 0, S, S);
    for (let i = 0; i < 9000; i++) { x.fillStyle = `rgba(${60 + r() * 60},${95 + r() * 60},${30 + r() * 30},${.25 + r() * .3})`; x.beginPath(); x.arc(r() * S, r() * S, 6 + r() * 26, 0, TAU); x.fill(); }
    for (let i = 0; i < 60000; i++) { const px = r() * S, py = r() * S, l = 4 + r() * 9; x.strokeStyle = `rgba(${50 + r() * 90},${90 + r() * 80},${25 + r() * 35},${.35 + r() * .4})`; x.lineWidth = 1 + r(); x.beginPath(); x.moveTo(px, py); x.lineTo(px + (r() - .5) * 3, py - l); x.stroke(); }
    const t = textura(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep, rep); return t;
  }

  // ---------- Suelo ----------
  const llano = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), mat({ map: texPasto(17), roughness: 1 }));
  llano.rotation.x = -Math.PI / 2; llano.position.y = -0.01; llano.receiveShadow = true; scene.add(llano);
  const alfombra = new THREE.Mesh(new THREE.CircleGeometry(16, 128), mat({ map: texSuelo() }));
  alfombra.rotation.x = -Math.PI / 2; alfombra.receiveShadow = true; scene.add(alfombra);

  // ---------- Calesita de dos pisos ----------
  const calesita = new THREE.Group(); scene.add(calesita);
  const R = 8, PISO = .45, R2 = 6.6, RIN2 = 2.8, Y2 = 3.4, ALTO = 6.6, TECHO_R = 8.8, TECHO_H = 1.8;
  const PB = [C.bordo, C.ambar, C.azul, C.violeta, C.oxido, '#2C7486'];
  const techoY = r => ALTO + TECHO_H * (r / TECHO_R) ** 1.15;   // techo dado vuelta: más alto en el borde

  const plataforma = new THREE.Mesh(new THREE.CylinderGeometry(R, R, PISO, 160), [mat({ map: texCanto() }), mat({ map: texPlataforma() }), mat({ color: C.carbon })]);
  plataforma.position.y = PISO / 2; calesita.add(sombra(plataforma));

  // segundo piso: un anillo de madera con baranda, alrededor del núcleo
  const gPiso2 = new THREE.RingGeometry(RIN2, R2, 140, 1); gPiso2.rotateX(-Math.PI / 2);
  const piso2 = new THREE.Mesh(gPiso2, mat({ map: texPlataforma(), side: THREE.DoubleSide })); piso2.position.y = Y2 + .25; calesita.add(sombra(piso2));
  const canto2 = new THREE.Mesh(new THREE.CylinderGeometry(R2, R2, .25, 140, 1, true), mat({ map: texCanto(), side: THREE.DoubleSide })); canto2.position.y = Y2 + .125; calesita.add(sombra(canto2));
  const bajo2 = new THREE.Mesh(gPiso2.clone(), mat({ color: '#2B2426', side: THREE.DoubleSide })); bajo2.position.y = Y2; calesita.add(bajo2);
  [[R2 - .05, 1], [RIN2 + .05, 1]].forEach(([r]) => {
    const pasam = new THREE.Mesh(new THREE.TorusGeometry(r, .04, 8, 160), mat({ color: C.oxido })); pasam.rotation.x = Math.PI / 2; pasam.position.y = Y2 + 1.25; calesita.add(sombra(pasam));
    [.4, .65, .9].forEach((h, k) => { const hilo = new THREE.Mesh(new THREE.TorusGeometry(r, .018, 6, 160), mat({ color: PB[k * 2 + (r > 4 ? 0 : 1)] })); hilo.rotation.x = Math.PI / 2; hilo.position.y = Y2 + .25 + h; calesita.add(hilo); });   // la baranda, de hilos de colores
  });
  for (let i = 0; i < 48; i++) { const a = i / 48 * TAU; const b = new THREE.Mesh(new THREE.CylinderGeometry(.025, .025, 1, 6), mat({ color: C.carbon })); b.position.set(Math.cos(a) * (R2 - .05), Y2 + .75, Math.sin(a) * (R2 - .05)); calesita.add(b); }

  // escalera caracol alrededor de los espejos
  const NE = 17, A0 = .3, AV = 1.55 * Math.PI;
  for (let k = 0; k < NE; k++) {
    const a = A0 + k / NE * AV, y = PISO + (k + 1) * (Y2 + .25 - PISO) / NE, rm = (1.45 + RIN2) / 2;
    const esc = new THREE.Mesh(new THREE.BoxGeometry(RIN2 - 1.45, .07, .5), mat({ color: k % 2 ? C.ambar : C.oxido, roughness: .7 }));
    esc.position.set(Math.cos(a) * rm, y, Math.sin(a) * rm); esc.rotation.y = -a; calesita.add(sombra(esc));
  }
  calesita.add(sombra(hiloTubo(Array.from({ length: 60 }, (_, k) => { const t = k / 59, a = A0 + t * AV; return new THREE.Vector3(Math.cos(a) * RIN2, PISO + 1 + t * (Y2 - PISO), Math.sin(a) * RIN2); }), .035, C.oxido, 200)));

  for (let i = 0; i < 26; i++) {
    const p = personaG('parado', 1.55 + rnd() * .35); scene.add(p); gente.push(p);
    caminan.push({ p, a: rnd() * TAU, r: 9.2 + rnd() * 2.6, v: (.06 + rnd() * .05) * (rnd() < .5 ? 1 : -1), fase: rnd() * TAU });
  }
  for (let i = 0; i < 9; i++) {
    const a = i / 9 * TAU + .3, r = 11.5 + rnd() * 2, p = personaG('foto', 1.55 + rnd() * .3);
    p.position.set(Math.cos(a) * r, 0, Math.sin(a) * r); p.lookAt(0, 0, 0); scene.add(p); gente.push(p);
  }
  function moverCaminantes(dt) {
    caminan.forEach(c => {
      c.a += c.v * dt; c.p.position.set(Math.cos(c.a) * c.r, 0, Math.sin(c.a) * c.r);
      c.p.rotation.y = -c.a + (c.v > 0 ? Math.PI : 0);
    });
  }
  moverCaminantes(0);
  let conGente = false;
  const bG = document.getElementById('gente');
  bG.addEventListener('click', () => {
    conGente = !conGente; gente.forEach(p => p.visible = conGente);
    bG.setAttribute('aria-pressed', String(conGente)); bG.textContent = conGente ? 'Con gente' : 'Sin gente';
  });

  // ---------- Hilo de algodón que entra desde fuera del cuadro ----------
  const pIn = [];
  for (let i = 0; i <= 160; i++) {
    const t = i / 160, r = 16 * (1 - t * .45), a = -Math.PI * .25 + t * TAU * 1.6;
    pIn.push(new THREE.Vector3(Math.cos(a) * r, .03 + Math.max(0, (t - .93) * 5), Math.sin(a) * r));
  }
  pIn.unshift(new THREE.Vector3(Math.cos(-Math.PI * .25) * 30, .03, Math.sin(-Math.PI * .25) * 30));
  scene.add(sombra(hiloTubo(pIn, .035, '#F7F2E8', 1200)));

  // ---------- Cámara: vistas ----------
  const vistas = {
    'v-frente': { p: [17, 6, 19], t: [0, 4, 0] },
    'v-espejo': { p: [3.6, 1.65, 3.4], t: [0, 1.9, 0] },
    'v-techo':  { p: [3.6, 4.9, 2.8], t: [-1, 9, -1] },
    'v-aerea':  { p: [3, 32, 13], t: [0, 3, 0] },
    'v-ras':    { p: [12, .35, 11], t: [0, 5, 0] },
    'v-zootropo': { p: [5.4, 5.3, 1.2], t: [-4, 4.4, -2] },
    'v-sillas': { p: [10.5, 1.7, 3.2], t: [5.2, 1.0, .4] }
  };
  let meta = null;
  Object.keys(vistas).forEach(id => {
    document.getElementById(id).addEventListener('click', () => {
      document.querySelectorAll('[id^="v-"]').forEach(b => b.setAttribute('aria-pressed', String(b.id === id)));
      meta = { p: new THREE.Vector3(...vistas[id].p), t: new THREE.Vector3(...vistas[id].t) };
      if (reduce) { camera.position.copy(meta.p); controls.target.copy(meta.t); meta = null; }
    });
  });
  controls.addEventListener('start', () => { meta = null; });

  let girando = !reduce;
  const bGirar = document.getElementById('girar');
  function pintarGiro() { bGirar.setAttribute('aria-pressed', String(girando)); bGirar.textContent = girando ? 'Girando' : 'Quieta'; }
  pintarGiro();
  bGirar.addEventListener('click', () => { girando = !girando; pintarGiro(); });
  document.getElementById('limpiar').addEventListener('click', () => document.body.classList.add('limpio'));
  document.getElementById('mostrar').addEventListener('click', () => document.body.classList.remove('limpio'));
  window.addEventListener('keydown', e => { if (e.key === 'h' || e.key === 'H') document.body.classList.toggle('limpio'); });

  // ---------- Bucle ----------
  function ajustar() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false); camera.aspect = w / h;
    camera.fov = w < 600 ? 55 : 42; camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', ajustar); ajustar();

  const reloj = new THREE.Clock(); let cuadroN = 0, tiempo = 0;
  function cuadro() {
    const dt = Math.min(reloj.getDelta(), .05);
    if (girando) {
      calesita.rotation.y += dt * .2;
      tiempo += dt;
      colgadas.forEach(p => { p.rotation.x = .1 + Math.sin(tiempo * 1.3 + p.userData.fase) * .06; });
      colgadasSillas.forEach(p => { p.rotation.z = Math.sin(tiempo * 1.1 + p.userData.fase) * .04; });   // con el giro, las telas se abren hacia afuera
      corona.rotation.y -= dt * .4;
    }
    if (conGente && !reduce) moverCaminantes(dt);
    if (meta) {
      camera.position.lerp(meta.p, .06); controls.target.lerp(meta.t, .06);
      if (camera.position.distanceTo(meta.p) < .02) meta = null;
    }
    controls.update();
    if (camera.position.y < .25) camera.position.y = .25;
    if (cuadroN++ % 2 === 0) { espejos.visible = false; camCubo.update(renderer, scene); espejos.visible = true; }
    renderer.render(scene, camera);
    requestAnimationFrame(cuadro);
  }
  cuadro();
})();
</script>

</body></html>
