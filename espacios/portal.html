<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: escena 3D a pantalla completa con luz de día; rótulos arriba y mandos abajo. Lo oculto: azul profundo bajo papel rasgado, destellos ámbar, telas crudas. */
:root {
  --papel: #F3F3F1;
  --azul: #003B94;
  --ambar: #E19A00;
  --crudo: #D8C8A8;
  --tinta: #1F1C1E;
  --display: "Clash Display", "Big Shoulders", "Arial Black", system-ui, sans-serif;
  --mono: "Big Shoulders", "Arial Narrow", system-ui, sans-serif;
}
html, body { height: 100%; }
body { background: var(--papel); color: var(--tinta); overflow: hidden; font-family: var(--mono); }
#escena { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
.rotulo {
  position: fixed; top: 0; left: 0; right: 0;
  padding-top: calc(14px + env(safe-area-inset-top, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; pointer-events: none;
}
.marca { font-family: var(--display); font-weight: 800; line-height: .82; font-size: clamp(26px, 4vw, 40px); color: var(--azul); letter-spacing: -.02em; }
.marca small { display: block; font-size: .42em; letter-spacing: .02em; font-weight: 500; }
.ficha { text-align: right; font-size: 11px; line-height: 1.5; letter-spacing: .06em; text-transform: uppercase; }
.ficha strong { display: block; font-family: var(--display); font-weight: 800; text-transform: none; letter-spacing: -.01em; font-size: clamp(20px, 3vw, 30px); line-height: 1; color: var(--azul); margin-bottom: 4px; }
.ficha .hilo { color: #8A6A44; }
.mandos {
  position: fixed; left: 0; right: 0; bottom: 0;
  padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between;
}
.grupo { display: flex; flex-wrap: wrap; gap: 6px; }
button { font: 600 14px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; background: var(--papel); color: var(--azul); border: 1.5px dashed var(--azul); padding: 9px 12px; cursor: pointer; }
button[aria-pressed="true"] { background: var(--azul); color: var(--papel); border-style: solid; }
button:hover { border-style: solid; }
button:focus-visible { outline: 2px solid var(--ambar); outline-offset: 2px; }
#atravesar { border-color: #8A5A00; color: #8A5A00; }
.pista { font-size: 11px; opacity: .7; }
#mostrar { position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); opacity: .35; font-size: 11px; padding: 6px 9px; }
#mostrar:hover { opacity: 1; }
body.limpio .rotulo, body.limpio .mandos { display: none; }
body:not(.limpio) #mostrar { display: none; }
@media (max-width: 520px) { .pista { display: none; } .ficha span { display: none; } }
body.embebido .marca{display:none}
</style>

<canvas id="escena" aria-label="Modelo 3D del portal de ingreso de Bio Feria: un frente de papel rasgado sobre azul de contorno irregular, con puntas, y una abertura de 16 m; detrás, tres islas de elementos finos (papeles de distintas formas y velos de lino) dejan cuatro carriles libres y arriba cuelgan papeles finos; a los costados, entre bambalinas de teatro, hay espejos que deforman; las cortinas de tiras están solo en los carriles de afuera"></canvas>

<header class="rotulo">
  <div class="marca">BIO<small>FERIA</small></div>
  <div class="ficha">
    <strong>El portal</strong>
    <span>Instalación · Lo oculto<br></span>
    <span class="hilo">Lino · capas y bambalinas</span><br>
    9 al 11 de abril de 2027
  </div>
</header>

<nav class="mandos" aria-label="Controles de la escena">
  <div class="grupo" role="group" aria-label="Vistas">

    <button id="v-atras" aria-pressed="false">Desde adentro</button>
    <button id="v-aerea" aria-pressed="false">Desde arriba</button>
    <button id="v-espejos" aria-pressed="false">Entre bambalinas</button>

    <button id="atravesar">Atravesar el portal</button>
    <button id="gente" aria-pressed="false">Sin gente</button>
    <button id="limpiar">Ocultar textos</button>
  </div>
  <div class="pista">Arrastrá para mirar alrededor · rueda o pellizco para acercar</div>
</nav>

<script>
(function () {
  const C = { papel:'#F1ECE0', azul:'#003B94', azulOsc:'#00296A', ambar:'#E19A00', crudo:'#D8C8A8', lino:'#CDBE9C', tinta:'#1F1C1E' };
  const TAU = Math.PI * 2;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let semilla = 7;
  const rnd = () => { semilla = (semilla * 9301 + 49297) % 233280; return semilla / 233280; };

  const canvas = document.getElementById('escena');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.08;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color('#E6EEF5');
  scene.fog = new THREE.Fog('#E3EBEE', 30, 80);

  const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 200);
  const controls = new THREE.OrbitControls(camera, canvas);
  controls.enableDamping = true; controls.dampingFactor = .08;
  controls.minDistance = 1.2; controls.maxDistance = 45;
  controls.maxPolarAngle = Math.PI * .495;

  // luz de la tarde, de atrás y de costado, para que las telas brillen a contraluz
  scene.add(new THREE.HemisphereLight('#FFF4E2', '#8C9A6A', .75));
  const sol = new THREE.DirectionalLight('#FFDDB0', 1.35);
  sol.position.set(-9, 10, -12);
  sol.castShadow = true;
  sol.shadow.mapSize.set(2048, 2048);
  Object.assign(sol.shadow.camera, { left: -18, right: 18, top: 18, bottom: -18, near: 1, far: 60 });
  sol.shadow.bias = -.0006;
  scene.add(sol);
  const relleno = new THREE.DirectionalLight('#FFF6EA', .45);
  relleno.position.set(6, 6, 12); scene.add(relleno);

  // ---------- Texturas ----------
  function lienzo(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }
  function textura(c) { const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = renderer.capabilities.getMaxAnisotropy(); return t; }
  function rasgado(x, cx, cy, w, h, col) {
    x.fillStyle = col; x.beginPath();
    const n = 26;
    for (let i = 0; i < n; i++) {
      const a = i / n * TAU, r = 1 + (rnd() - .5) * .35;
      const px = cx + Math.cos(a) * w / 2 * r, py = cy + Math.sin(a) * h / 2 * r;
      i ? x.lineTo(px, py) : x.moveTo(px, py);
    }
    x.closePath(); x.fill();
  }
  function puntos(x, x0, y0, w, h, col, paso) {
    x.fillStyle = col;
    for (let py = y0; py < y0 + h; py += paso) for (let px = x0 + ((py - y0) / paso % 2) * paso / 2; px < x0 + w; px += paso) {
      const k = .35 + .65 * rnd(); x.beginPath(); x.arc(px, py, paso * .32 * k, 0, TAU); x.fill();
    }
  }
  function grano(x, w, h, a) {
    const img = x.getImageData(0, 0, w, h), d = img.data;
    for (let i = 0; i < d.length; i += 4) { const n = (rnd() - .5) * a; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
    x.putImageData(img, 0, 0);
  }
  // décollage: capas de papel rasgado sobre azul, con trama, manchas y retazos ámbar
  function decollage(s, papelPct) {
    semilla = s;
    const S = 1024, [c, x] = lienzo(S, S);
    x.fillStyle = C.azul; x.fillRect(0, 0, S, S);
    for (let i = 0; i < 6; i++) { x.fillStyle = 'rgba(0,30,90,.25)'; x.fillRect(rnd() * S, rnd() * S, 200 * rnd(), 300 * rnd()); }
    puntos(x, rnd() * 400, rnd() * 400, 380, 420, 'rgba(255,255,255,.35)', 20);
    const tiras = 7 + Math.floor(papelPct * 10);
    for (let i = 0; i < tiras; i++) rasgado(x, rnd() * S, rnd() * S, 220 + rnd() * 380, 260 + rnd() * 460, i % 5 === 4 ? '#E8DCC2' : C.papel);
    for (let i = 0; i < 3; i++) puntos(x, rnd() * 700, rnd() * 700, 260, 300, 'rgba(0,59,148,.85)', 18);
    for (let i = 0; i < 3; i++) rasgado(x, rnd() * S, rnd() * S, 90 + rnd() * 110, 70 + rnd() * 120, C.ambar);
    for (let i = 0; i < 10; i++) { x.fillStyle = `rgba(120,80,30,${.06 + rnd() * .08})`; x.beginPath(); x.arc(rnd() * S, rnd() * S, 30 + rnd() * 90, 0, TAU); x.fill(); }
    x.fillStyle = 'rgba(30,30,40,.18)';
    for (let i = 0; i < 6; i++) x.fillRect(rnd() * S, rnd() * S, 140 + rnd() * 200, 18 + rnd() * 20);
    grano(x, S, S, 22);
    return textura(c);
  }

  function texDintel() {
    semilla = 41;
    const W = 2048, H = 300, [c, x] = lienzo(W, H);
    x.fillStyle = C.azul; x.fillRect(0, 0, W, H);
    rasgado(x, W * .55, H * .5, W * .9, H * 1.4, C.papel);
    rasgado(x, W * .12, H * .45, 380, 260, '#C9C0AE');
    puntos(x, W * .78, 10, 320, 260, 'rgba(0,59,148,.85)', 16);
    rasgado(x, W * .3, H * .78, 160, 90, C.ambar);
    for (let i = 0; i < 12; i++) { x.fillStyle = `rgba(120,80,30,${.05 + rnd() * .07})`; x.beginPath(); x.arc(rnd() * W, rnd() * H, 20 + rnd() * 60, 0, TAU); x.fill(); }
    grano(x, W, H, 18);
    const t = textura(c);
    // el logo de Bio Feria, en negro, sobre el papel del dintel
    const logo = new Image();
    logo.onload = () => { const h = 150, w = h * logo.width / logo.height; x.drawImage(logo, W * .5 - w / 2, 125 - h / 2, w, h); t.needsUpdate = true; };
    logo.src = LOGO;
    return t;
  }
  // el frente entero en una sola lámina: papel rasgado sobre azul, con el logo en negro arriba de la boca
  function texFrente() {
    semilla = 43;
    const W = 4096, H = 1730, [c, x] = lienzo(W, H);
    const X = v => (v + 11) / 22 * W, Z = v => H - v / 9.3 * H, M_ = v => v / 22 * W;
    x.fillStyle = C.azul; x.fillRect(0, 0, W, H);
    for (let i = 0; i < 10; i++) { x.fillStyle = 'rgba(0,30,90,.25)'; x.fillRect(rnd() * W, rnd() * H, 300 * rnd(), 400 * rnd()); }
    for (let i = 0; i < 26; i++) rasgado(x, rnd() * W, rnd() * H, 160 + rnd() * 420, 140 + rnd() * 380, i % 6 === 5 ? '#E8DCC2' : C.papel);
    for (let i = 0; i < 5; i++) puntos(x, rnd() * W, rnd() * H, 300, 260, 'rgba(0,59,148,.85)', 18);
    for (let i = 0; i < 6; i++) rasgado(x, rnd() * W, rnd() * H, 90 + rnd() * 140, 70 + rnd() * 120, C.ambar);
    rasgado(x, X(0), Z(5.9), M_(6.2), M_(2.2), C.papel);          // papel claro detrás del logo
    for (let i = 0; i < 18; i++) { x.fillStyle = `rgba(120,80,30,${.05 + rnd() * .07})`; x.beginPath(); x.arc(rnd() * W, rnd() * H, 30 + rnd() * 90, 0, TAU); x.fill(); }
    grano(x, W, H, 18);
    const t = textura(c);
    const logo = new Image();
    logo.onload = () => { const h = M_(1.25), w = h * logo.width / logo.height; x.drawImage(logo, X(0) - w / 2, Z(5.9) - h / 2, w, h); t.needsUpdate = true; };
    logo.src = LOGO;
    return t;
  }
  function texAzul() {
    semilla = 99;
    const S = 512, [c, x] = lienzo(S, S);
    x.fillStyle = C.azul; x.fillRect(0, 0, S, S);
    for (let i = 0; i < 8; i++) { x.fillStyle = 'rgba(0,25,80,.3)'; x.fillRect(rnd() * S, rnd() * S, 120 * rnd(), 200 * rnd()); }
    grano(x, S, S, 20);
    return textura(c);
  }
  function texSenda() {                                   // senda de ripio claro que atraviesa el portal
    semilla = 5;
    const S = 2048, [c, x] = lienzo(S, S);
    x.clearRect(0, 0, S, S);
    for (let i = 0; i < 130000; i++) {
      const py = rnd() * S, px = S / 2 + (rnd() - .5) * (400 + 50 * Math.sin(py / 300));
      const g = 150 + rnd() * 70; x.fillStyle = `rgba(${g},${g - 8},${g - 22},.95)`;
      x.beginPath(); x.arc(px, py, .8 + rnd() * 1.6, 0, TAU); x.fill();
    }
    return textura(c);
  }
  function texTela() {
    semilla = 3;
    const S = 512, [c, x] = lienzo(S, S);
    x.fillStyle = C.crudo; x.fillRect(0, 0, S, S);
    for (let y = 0; y < S; y += 3) { x.fillStyle = `rgba(${rnd() < .5 ? 255 : 90},${rnd() < .5 ? 250 : 70},${rnd() < .5 ? 235 : 40},.08)`; x.fillRect(0, y, S, 1.5); }
    for (let px = 0; px < S; px += 3) { x.fillStyle = 'rgba(80,60,30,.06)'; x.fillRect(px, 0, 1.2, S); }
    const t = textura(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(3, 4); return t;
  }

  // los colores de la paleta se pasan a lineal para que se vean tal cual (sin quedar pastel)
  const mat = (opt) => { if (typeof opt.color === 'string') opt.color = new THREE.Color(opt.color).convertSRGBToLinear(); return new THREE.MeshStandardMaterial(Object.assign({ roughness: .9, metalness: 0 }, opt)); };
  function sombra(o) { o.traverse(m => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } }); return o; }
  const V = (x, y, z) => new THREE.Vector3(x, y, z);

  // pasto natural del predio (una baldosa de unos 12 m que se repite)
  function texPasto(rep) {
    let s = 5; const r = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    const S = 2048, [c, x] = lienzo(S, S);
    x.fillStyle = '#6E8A3E'; x.fillRect(0, 0, S, S);
    for (let i = 0; i < 9000; i++) { x.fillStyle = `rgba(${60 + r() * 60},${95 + r() * 60},${30 + r() * 30},${.25 + r() * .3})`; x.beginPath(); x.arc(r() * S, r() * S, 6 + r() * 26, 0, TAU); x.fill(); }
    for (let i = 0; i < 60000; i++) { const px = r() * S, py = r() * S, l = 4 + r() * 9; x.strokeStyle = `rgba(${50 + r() * 90},${90 + r() * 80},${25 + r() * 35},${.35 + r() * .4})`; x.lineWidth = 1 + r(); x.beginPath(); x.moveTo(px, py); x.lineTo(px + (r() - .5) * 3, py - l); x.stroke(); }
    const t = textura(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep, rep); return t;
  }

  // ---------- Suelo ----------
  const suelo = new THREE.Mesh(new THREE.PlaneGeometry(90, 90), mat({ map: texPasto(8), roughness: 1 }));
  suelo.rotation.x = -Math.PI / 2; suelo.receiveShadow = true; scene.add(suelo);
  const senda = new THREE.Mesh(new THREE.PlaneGeometry(90, 90), mat({ map: texSenda(), transparent: true, depthWrite: false, roughness: 1 }));
  senda.rotation.x = -Math.PI / 2; senda.position.y = .004; senda.receiveShadow = true; scene.add(senda);

  // ---------- Modelo: el mismo de la planta (metros). x = ancho, y = profundidad hacia la feria, z = altura ----------
  // En three: X = x, Y = z, Z = -y (la feria queda hacia -Z)
  const M = (x, y, z) => V(x, z || 0, -y);
  const mAzul = mat({ map: texAzul(), roughness: .85 });
  const deco = [decollage(11, .6), decollage(23, .4), decollage(37, .7), decollage(53, .5), decollage(71, .55), decollage(83, .35)];
  const mDeco = deco.map(t => mat({ map: t, roughness: .88 }));
  function decoEn(i, w, h) {                       // décollage escalado a un plano de w × h metros (uv en metros)
    const t = deco[i].clone(); t.needsUpdate = true; t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(1 / Math.max(w, h) * 1.4, 1 / Math.max(w, h) * 1.4);
    return mat({ map: t, roughness: .88, side: THREE.DoubleSide });
  }
  // placa: una forma 2D (en metros, x a lo largo, y hacia arriba) con espesor, parada entre dos puntos de la planta
  function placa(forma, a, b, esp, mFrente, mCanto) {
    const g = new THREE.ExtrudeGeometry(forma, { depth: esp, bevelEnabled: false, curveSegments: 24 });
    g.translate(0, 0, -esp / 2);
    const m = new THREE.Mesh(g, [mFrente, mCanto || mAzul]);
    m.position.copy(M(a[0], a[1], 0));
    m.rotation.y = Math.atan2(b[1] - a[1], b[0] - a[0]);
    scene.add(sombra(m)); return m;
  }
  const largo = (a, b) => Math.hypot(b[0] - a[0], b[1] - a[1]);

    { p: V(-2.4, 1.65, -1.2), t: V(-5, 2.4, -2.5) },
    { p: V(-2.4, 1.65, -2.8), t: V(1, 2.2, -4) },
    { p: V(-2.4, 1.65, -6.5), t: V(-2.4, 2.0, -14) },
    { p: V(-1.5, 1.7, -13), t: V(0, 2.8, -2) }
  ];
  document.getElementById('atravesar').addEventListener('click', () => {
    document.querySelectorAll('[id^="v-"]').forEach(b => b.setAttribute('aria-pressed', 'false'));
    meta = null;
    if (reduce) { camera.position.copy(recorrido[5].p); controls.target.copy(recorrido[5].t); return; }
    viaje = { t: 0 }; controls.enabled = false;
  });
  const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
  let abajo = null;
  canvas.addEventListener('pointerdown', e => { abajo = [e.clientX, e.clientY]; });
  canvas.addEventListener('pointerup', e => {
    if (!abajo || Math.hypot(e.clientX - abajo[0], e.clientY - abajo[1]) > 6) return;
    const r = canvas.getBoundingClientRect();
    ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ptr, camera);
    const hit = ray.intersectObjects(tapas.map(t => t.tapa))[0];
    if (hit) { const Tp = tapas.find(t => t.tapa === hit.object); Tp.abierta = !Tp.abierta; }
  });
  (document.getElementById('abrir') || { addEventListener() {} }).addEventListener('click', () => { const todas = tapas.every(t => t.abierta); tapas.forEach(t => t.abierta = !todas); });
  document.getElementById('limpiar').addEventListener('click', () => document.body.classList.add('limpio'));
  document.getElementById('mostrar').addEventListener('click', () => document.body.classList.remove('limpio'));
  window.addEventListener('keydown', e => { if (e.key === 'h' || e.key === 'H') document.body.classList.toggle('limpio'); });

  function ajustar() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false); camera.aspect = w / h;
    camera.fov = w < 600 ? 58 : 42; camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', ajustar); ajustar();

  const reloj = new THREE.Clock(); let tiempo = 0;
  moverTelas(0);
  function cuadro() {
    const dt = Math.min(reloj.getDelta(), .05); tiempo += dt;
    if (!reduce) moverTelas(tiempo);
    if (torsos.visible) moverGente(dt, tiempo);
    moverRetazos(tiempo);
    tiras.forEach(T => {                                 // las tiras se abren al paso de la cámara y vuelven a caer
      const cerca = Math.abs(camera.position.x - T.x) < .7 && Math.abs(camera.position.z + 5.5) < .9 && camera.position.y < 4;
      T.abre += ((cerca ? 1 : 0) - T.abre) * .12;
      T.t.rotation.x = T.abre * (camera.position.z > -5.5 ? -1.1 : 1.1) + (reduce ? 0 : .03 * Math.sin(tiempo * 1.3 + T.fase));
      T.t.rotation.y = T.abre * (T.x - camera.position.x) * .8;
    });
    tapas.forEach(Tp => { Tp.ang += ((Tp.abierta ? -1.9 : 0) - Tp.ang) * .1; Tp.bis.rotation.x = Tp.ang; });
    if (Math.floor(tiempo * 4) !== cuadro.ultimo) { cuadro.ultimo = Math.floor(tiempo * 4); actualizarEspejos(); }
    if (viaje) {
      viaje.t += dt / 2.2;
      const n = recorrido.length - 1, i = Math.min(n - 1, Math.floor(viaje.t)), k = Math.min(1, viaje.t - i);
      const e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      camera.position.lerpVectors(recorrido[i].p, recorrido[i + 1].p, e);
      controls.target.lerpVectors(recorrido[i].t, recorrido[i + 1].t, e);
      if (viaje.t >= n) { viaje = null; controls.enabled = true; document.getElementById('v-atras').setAttribute('aria-pressed', 'true'); }
    } else if (meta) {
      camera.position.lerp(meta.p, .06); controls.target.lerp(meta.t, .06);
      if (camera.position.distanceTo(meta.p) < .02) meta = null;
    }
    controls.update();
    renderer.render(scene, camera);
    requestAnimationFrame(cuadro);
  }
  cuadro();
})();
</script>
