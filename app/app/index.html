<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script>if(new URLSearchParams(location.search).has('embed'))document.documentElement.classList.add('embedded');</script>
  <meta name="theme-color" content="#003b94">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Bioferia · Tu guía para cambiar</title>
  <meta name="description" content="Prototipo móvil de Bioferia: una guía de sustentabilidad para todos los días, BioPoints y el festival en un mismo lugar.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="mobile.css">
  <link rel="stylesheet" href="identity.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" type="button" data-go="home" aria-label="Bioferia, ir al inicio">
        <img src="../assets/bioferia-logo.png" alt="Bioferia">
        <span>CELEBREMOS EL CAMBIO</span>
      </button>
      <div class="topbar-actions">
        <button class="round-button" type="button" data-go="saved" aria-label="Artículos guardados"><span aria-hidden="true">♡</span><b id="saved-count"></b></button>
      </div>
    </header>
    <div class="identity-thread" aria-hidden="true"></div>
    <main id="app-content" class="app-content" aria-live="polite" tabindex="-1"></main>
    <nav id="app-nav" class="app-nav" aria-label="Navegación principal"></nav>
  </div>
  <script src="mobile.js" defer></script>
</body>
</html>
